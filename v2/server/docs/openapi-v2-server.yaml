  /api/v1/devbox/{name}/files/download:
    get:
      description: Returns a binary file stream on success. On failure, the endpoint
        returns the standard JSON error response envelope.
      operationId: downloadDevboxFile
      parameters:
      - $ref: '#/components/parameters/DevboxName'
      - $ref: '#/components/parameters/FilePath'
      - $ref: '#/components/parameters/TransferTimeoutSeconds'
      - $ref: '#/components/parameters/ContainerName'
      - $ref: '#/components/parameters/DownloadFilename'
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: Binary file stream.
          headers:
            Content-Disposition:
              description: Download filename returned by the API.
              schema:
                example: attachment; filename="app.txt"
                type: string
            Content-Length:
              description: Byte size when known.
              schema:
                example: "42"
                type: string
            X-Devbox-Path:
              description: Resolved file path inside the Devbox.
              schema:
                example: /home/devbox/project/a.txt
                type: string
        "400":
          content:
            application/json:
              examples:
                pathRequired:
                  summary: Missing path
                  value:
                    code: 400
                    message: path is required
                timeoutInvalid:
                  summary: Invalid timeout
                  value:
                    code: 400
                    message: timeoutSeconds must be in [1, 3600]
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid download request.
        "401":
          content:
            application/json:
              examples:
                invalidToken:
                  summary: Invalid JWT
                  value:
                    code: 401
                    message: invalid token
                missingHeader:
                  summary: Missing Authorization header
                  value:
                    code: 401
                    message: missing Authorization header
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid bearer token.
        "404":
          content:
            application/json:
              examples:
                fileNotFound:
                  summary: File missing
                  value:
                    code: 404
                    message: file not found
                podNotFound:
                  summary: Pod missing
                  value:
                    code: 404
                    message: devbox pod not found
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Pod or file not found.
        "409":
          content:
            application/json:
              examples:
                podNotRunning:
                  summary: Pod not running
                  value:
                    code: 409
                    message: 'devbox pod is not running: Pending'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Devbox pod is not in a runnable state.
        "500":
          content:
            application/json:
              examples:
                downloadFailed:
                  summary: Download failure
                  value:
                    code: 500
                    message: 'download file failed: some upstream error'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Download failed.
        "504":
          content:
            application/json:
              examples:
                timeout:
                  summary: Download timeout
                  value:
                    code: 504
                    message: download file timeout
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Download timed out.
      summary: Download a file from the Devbox
      tags:
      - Files
  /api/v1/devbox/{name}/files/upload:
    post:
      description: Streams raw file bytes to the in-pod Devbox SDK server. Use query
        parameters for destination path and optional mode.
      operationId: uploadDevboxFile
      parameters:
      - $ref: '#/components/parameters/DevboxName'
      - $ref: '#/components/parameters/FilePath'
      - $ref: '#/components/parameters/TransferTimeoutSeconds'
      - $ref: '#/components/parameters/FileMode'
      - $ref: '#/components/parameters/ContainerName'
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                uploaded:
                  summary: Uploaded file
                  value:
                    code: 200
                    data:
                      container: devbox
                      mode: "0644"
                      name: demo-devbox
                      namespace: ns-test
                      path: /home/devbox/project/a.txt
                      podName: demo-devbox-7d9b5f7f45-s6j8n
                      sizeBytes: 42
                      timeoutSecond: 300
                      uploadedAt: "2026-03-03T10:20:30Z"
                    message: ok
              schema:
                additionalProperties: false
                properties:
                  code:
                    example: 200
                    type: integer
                  data:
                    $ref: '#/components/schemas/UploadData'
                  message:
                    example: ok
                    type: string
                required:
                - code
                - message
                - data
                type: object
          description: File uploaded.
        "400":
          content:
            application/json:
              examples:
                emptyBody:
                  summary: Empty request body
                  value:
                    code: 400
                    message: request body is empty
                modeInvalid:
                  summary: Invalid mode
                  value:
                    code: 400
                    message: 'invalid mode: must be octal digits like 644 or 0644'
                pathRequired:
                  summary: Missing path
                  value:
                    code: 400
                    message: path is required
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid upload request.
        "401":
          content:
            application/json:
              examples:
                invalidToken:
                  summary: Invalid JWT
                  value:
                    code: 401
                    message: invalid token
                missingHeader:
                  summary: Missing Authorization header
                  value:
                    code: 401
                    message: missing Authorization header
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid bearer token.
        "404":
          content:
            application/json:
              examples:
                podNotFound:
                  summary: Pod missing
                  value:
                    code: 404
                    message: devbox pod not found
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Pod or target file endpoint not found.
        "409":
          content:
            application/json:
              examples:
                podNotRunning:
                  summary: Pod not running
                  value:
                    code: 409
                    message: 'devbox pod is not running: Pending'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Devbox pod is not in a runnable state.
        "500":
          content:
            application/json:
              examples:
                uploadFailed:
                  summary: Upload failure
                  value:
                    code: 500
                    message: 'upload file failed: some upstream error'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Upload failed.
        "504":
          content:
            application/json:
              examples:
                timeout:
                  summary: Upload timeout
                  value:
                    code: 504
                    message: upload file timeout
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Upload timed out.
      summary: Upload a file to the Devbox
      tags:
      - Files
