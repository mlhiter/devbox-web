{{- if and .Values.frontend.enabled .Values.app.enabled }}
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: {{ .Values.app.name | quote }}
  namespace: {{ .Values.app.namespace | quote }}
spec:
  data:
    desc: DevBox
    url: {{ include "devbox-v2-frontend.frontendExternalURL" . | quote }}
  icon: {{ printf "%s/logo.svg" (include "devbox-v2-frontend.frontendExternalURL" .) | quote }}
  i18n:
    zh:
      name: DevBox
    zh-Hans:
      name: DevBox
  name: DevBox
  type: {{ .Values.app.type | quote }}
  displayType: {{ .Values.app.displayType | quote }}
{{- end }}
