{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: devbox-frontend-config
  namespace: {{ .Values.frontend.namespace | quote }}
data:
  config.yaml: |-
    addr: {{ .Values.frontend.config.addr }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devbox-frontend
  namespace: {{ .Values.frontend.namespace | quote }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: devbox-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        app: devbox-frontend
    spec:
      initContainers:
      - name: devbox-frontend-init
        image: {{ include "devbox-v1.frontendImage" . | quote }}
        imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
        env:
        - name: DATABASE_URL
          value: {{ .Values.platform.databaseUrl | quote }}
        - name: DATABASE_PROVIDER
          value: {{ .Values.platform.databaseProvider | quote }}
        command:
        - sh
        - -c
        args:
        - |-
          cd /app
          DB_PROVIDER="${DATABASE_PROVIDER:-cockroachdb}"
          SCHEMA_PATH="./prisma/cockroach/schema.prisma"
          MIGRATION="20260125094114_add_template_repository_kind"
          if [ "$DB_PROVIDER" = "postgresql" ] || [ "$DB_PROVIDER" = "postgres" ] || [ "$DB_PROVIDER" = "pg" ]; then
            SCHEMA_PATH="./prisma/postgresql/schema.prisma"
            HAS_UUID_FN=$(psql "$DATABASE_URL" -tAc "SELECT 1 FROM pg_proc WHERE proname='gen_random_uuid' LIMIT 1;")
            if [ "$HAS_UUID_FN" != "1" ]; then
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE OR REPLACE FUNCTION public.gen_random_uuid() RETURNS uuid LANGUAGE SQL VOLATILE AS $func$ SELECT md5(random()::text || clock_timestamp()::text || txid_current()::text)::uuid; $func$;'
            fi
            HAS_MIGRATION=$(psql "$DATABASE_URL" -tAc "SELECT 1 FROM _prisma_migrations WHERE migration_name='${MIGRATION}' AND rolled_back_at IS NULL LIMIT 1;")
            if [ "$HAS_MIGRATION" = "1" ]; then
              prisma migrate deploy --schema "$SCHEMA_PATH"
              exit 0
            fi
            HAS_ENUM=$(psql "$DATABASE_URL" -tAc "SELECT 1 FROM pg_enum e JOIN pg_type t ON t.oid = e.enumtypid WHERE t.typname IN ('TemplateRepositoryKind','template_repository_kind') AND e.enumlabel = 'SERVICE' LIMIT 1;")
            if [ "$HAS_ENUM" = "1" ]; then
              prisma migrate resolve --schema "$SCHEMA_PATH" --applied "$MIGRATION"
            fi
          fi
          prisma migrate deploy --schema "$SCHEMA_PATH"
      containers:
      - name: devbox-frontend
        env:
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: {{ .Values.platform.tlsRejectUnauthorized | quote }}
        - name: DOCUMENT_URL_ZH
          value: {{ .Values.frontend.env.documentUrlZh | quote }}
        - name: DOCUMENT_URL_EN
          value: {{ .Values.frontend.env.documentUrlEn | quote }}
        - name: PRIVACY_URL_ZH
          value: {{ .Values.frontend.env.privacyUrlZh | quote }}
        - name: PRIVACY_URL_EN
          value: {{ .Values.frontend.env.privacyUrlEn | quote }}
        - name: SEALOS_DOMAIN
          value: {{ .Values.cloudDomain | quote }}
        - name: INGRESS_SECRET
          value: {{ .Values.certSecretName | quote }}
        - name: REGISTRY_ADDR
          value: {{ .Values.registry.addr | quote }}
        - name: REGISTRY_USER
          value: {{ .Values.registry.user | quote }}
        - name: REGISTRY_PASSWORD
          value: {{ .Values.registry.password | quote }}
        - name: DEVBOX_AFFINITY_ENABLE
          value: {{ .Values.frontend.env.devboxAffinityEnable | quote }}
        - name: MONITOR_URL
          value: {{ .Values.frontend.env.monitorUrl | quote }}
        - name: SQUASH_ENABLE
          value: {{ .Values.frontend.env.squashEnable | quote }}
        - name: ACCOUNT_URL
          value: {{ .Values.frontend.env.accountUrl | quote }}
        - name: ROOT_RUNTIME_NAMESPACE
          value: {{ .Values.controller.namespace | quote }}
        - name: INGRESS_DOMAIN
          value: {{ .Values.cloudDomain | quote }}
        - name: CURRENCY_SYMBOL
          value: {{ .Values.frontend.env.currencySymbol | quote }}
        - name: GPU_ENABLE
          value: {{ .Values.frontend.env.gpuEnable | quote }}
        - name: PRIVACY_URL
          value: {{ .Values.frontend.env.privacyUrlZh | quote }}
        - name: JWT_SECRET
          value: {{ .Values.platform.jwtSecret | quote }}
        - name: REGION_UID
          value: {{ .Values.platform.regionUid | quote }}
        - name: DATABASE_URL
          value: {{ .Values.platform.databaseUrl | quote }}
        - name: DATABASE_PROVIDER
          value: {{ .Values.platform.databaseProvider | quote }}
        - name: ENABLE_IMPORT_FEATURE
          value: {{ .Values.frontend.env.enableImportFeature | quote }}
        - name: ENABLE_WEBIDE_FEATURE
          value: {{ .Values.frontend.env.enableWebideFeature | quote }}
        - name: ENABLED_IDES
          value: {{ .Values.frontend.env.enabledIDEs | quote }}
        {{- with .Values.frontend.env.enableAdvancedEnvAndConfigmap }}
        - name: ENABLE_ADVANCED_ENV_AND_CONFIGMAP
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.frontend.env.enableAdvancedNfs }}
        - name: ENABLE_ADVANCED_NFS
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.frontend.env.enableAdvancedSharedMemory }}
        - name: ENABLE_ADVANCED_SHARED_MEMORY
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.frontend.env.cpuSlideMarkList }}
        - name: CPU_SLIDE_MARK_LIST
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.frontend.env.memorySlideMarkList }}
        - name: MEMORY_SLIDE_MARK_LIST
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.frontend.env.storageDefault }}
        - name: STORAGE_DEFAULT
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.frontend.env.domainChallengeSecret }}
        - name: DEVBOX_DOMAIN_CHALLENGE_SECRET
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.frontend.env.nfsStorageClassName }}
        - name: NFS_STORAGE_CLASS_NAME
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.frontend.env.nfsMaxSize }}
        - name: NFS_MAX_SIZE
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.frontend.env.webidePort }}
        - name: WEBIDE_PORT
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.frontend.env.customScripts }}
        - name: CUSTOM_SCRIPTS
          value: {{ . | quote }}
        {{- end }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
        image: {{ include "devbox-v1.frontendImage" . | quote }}
        imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
        volumeMounts:
        - name: devbox-frontend-volume
          mountPath: /config.yaml
          subPath: config.yaml
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - devbox-frontend
              topologyKey: kubernetes.io/hostname
      volumes:
      - name: devbox-frontend-volume
        configMap:
          name: devbox-frontend-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: devbox-frontend
  name: devbox-frontend
  namespace: {{ .Values.frontend.namespace | quote }}
spec:
  ports:
  - name: http
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: devbox-frontend
{{- end }}
