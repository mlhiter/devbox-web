cloudDomain: "127.0.0.1.nip.io"
cloudPort: ""
httpPort: ""
disableHttps: false
certSecretName: "wildcard-cert"

registry:
  addr: ""
  user: ""
  password: ""

platform:
  databaseUrl: ""
  databaseProvider: "cockroachdb"
  jwtSecret: ""
  regionUid: ""
  tlsRejectUnauthorized: "1"

controller:
  enabled: true
  namespace: devbox-system
  replicas: 1
  image:
    repository: ghcr.io/sealos-apps/devbox-v1-controller
    tag: latest
    pullPolicy: Always
  requestCpuRate: "20"
  requestMemoryRate: "10"
  matchers:
    enablePodEphemeralStorageMatcher: false
    enablePodAnnotationsMatcher: true
    enablePodEnvMatcher: true
    enablePodResourceMatcher: true
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  defaultUserRoleBinding:
    enabled: true

frontend:
  enabled: true
  namespace: devbox-system
  replicas: 1
  image:
    repository: ghcr.io/sealos-apps/devbox-v1-frontend
    tag: latest
    pullPolicy: Always
  resources:
    limits:
      cpu: 2000m
      memory: 2048Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    documentUrlZh: https://sealos.run/docs/overview/intro
    documentUrlEn: https://sealos.io/docs/overview/intro
    privacyUrlZh: https://sealos.run/docs/msa/privacy-policy
    privacyUrlEn: https://sealos.io/docs/msa/privacy-policy
    monitorUrl: http://launchpad-monitor.sealos.svc.cluster.local:8428
    accountUrl: http://account-service.account-system.svc.cluster.local:2333
    appLaunchpadUrl: http://applaunchpad-frontend.applaunchpad-frontend.svc.cluster.local:3000/api/v1alpha
    currencySymbol: shellCoin
    gpuEnable: "false"
    gpuSchedulerMode: "native"
    squashEnable: "false"
    devboxAffinityEnable: "true"
    enableImportFeature: "true"
    enableWebideFeature: "true"
    enabledIDEs: ""
    enableAdvancedEnvAndConfigmap: "true"
    enableAdvancedNfs: "true"
    enableAdvancedSharedMemory: "true"
    cpuSlideMarkList: "2,4,8,16,32"
    memorySlideMarkList: "4,8,16,32,64"
    storageDefault: "20"
    domainChallengeSecret: ""
    nfsStorageClassName: "nfs-csi"
    nfsMaxSize: "1000"
    webidePort: "9999"
    customScripts: ""
  config:
    addr: ":3000"

ingress:
  enabled: true
  className: nginx
  hostPrefix: devbox

app:
  enabled: true
  namespace: app-system
  name: devbox
  displayType: normal
  type: iframe

extraManifests: []
