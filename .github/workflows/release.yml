name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.25.3"
  RUST_TOOLCHAIN: "stable"
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  DOCKER_BUILDKIT: "1"
  DOCKER_CLI_EXPERIMENTAL: enabled

jobs:
  v1-images:
    name: Release Image / ${{ matrix.name }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v1-controller
            image_name: devbox-v1-controller
            dockerfile: v1/controller/Dockerfile
            context: v1/controller
            arch: amd64
            runner: ubuntu-24.04
          - name: v1-controller
            image_name: devbox-v1-controller
            dockerfile: v1/controller/Dockerfile
            context: v1/controller
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: v1-frontend
            image_name: devbox-v1-frontend
            dockerfile: v1/frontend/Dockerfile
            context: v1/frontend
            arch: amd64
            runner: ubuntu-24.04
          - name: v1-frontend
            image_name: devbox-v1-frontend
            dockerfile: v1/frontend/Dockerfile
            context: v1/frontend
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: v1-cri-shim-patch
            image_name: devbox-v1-cri-shim-patch
            dockerfile: v1/cri-shim/patch/Dockerfile
            context: v1/cri-shim
            arch: amd64
            runner: ubuntu-24.04
          - name: v1-cri-shim-patch
            image_name: devbox-v1-cri-shim-patch
            dockerfile: v1/cri-shim/patch/Dockerfile
            context: v1/cri-shim
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/${{ matrix.image_name }}"
          TAGS=(
            "${IMAGE}:${GITHUB_REF_NAME}-${{ matrix.arch }}"
            "${IMAGE}:sha-${SHORT_SHA}-${{ matrix.arch }}"
            "${IMAGE}:latest-${{ matrix.arch }}"
          )

          BUILD_ARGS=(
            --platform "linux/${{ matrix.arch }}"
            --file "${{ matrix.dockerfile }}"
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}"
            --label "org.opencontainers.image.architecture=${{ matrix.arch }}"
            --label "runnumber=${GITHUB_RUN_ID}"
          )
          for tag in "${TAGS[@]}"; do
            BUILD_ARGS+=(--tag "${tag}")
          done

          docker build "${BUILD_ARGS[@]}" "${{ matrix.context }}"
          for tag in "${TAGS[@]}"; do
            docker push "${tag}"
          done

  v1-image-manifests:
    name: Release Manifest / v1 / ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    needs:
      - v1-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: devbox-v1-controller
          - image_name: devbox-v1-frontend
          - image_name: devbox-v1-cri-shim-patch
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch image manifests
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/${{ matrix.image_name }}"

          docker manifest create "${IMAGE}:${GITHUB_REF_NAME}" \
            "${IMAGE}:${GITHUB_REF_NAME}-amd64" \
            "${IMAGE}:${GITHUB_REF_NAME}-arm64"
          docker manifest push "${IMAGE}:${GITHUB_REF_NAME}"

          docker manifest create "${IMAGE}:sha-${SHORT_SHA}" \
            "${IMAGE}:sha-${SHORT_SHA}-amd64" \
            "${IMAGE}:sha-${SHORT_SHA}-arm64"
          docker manifest push "${IMAGE}:sha-${SHORT_SHA}"

          docker manifest create "${IMAGE}:latest" \
            "${IMAGE}:latest-amd64" \
            "${IMAGE}:latest-arm64"
          docker manifest push "${IMAGE}:latest"

  v2-images:
    name: Release Image / ${{ matrix.name }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v2-controller
            image_name: devbox-v2-controller
            dockerfile: v2/controller/Dockerfile
            context: v2/controller
            arch: amd64
            runner: ubuntu-24.04
          - name: v2-controller
            image_name: devbox-v2-controller
            dockerfile: v2/controller/Dockerfile
            context: v2/controller
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: v2-frontend
            image_name: devbox-v2-frontend
            dockerfile: v2/frontend/Dockerfile
            context: v2/frontend
            arch: amd64
            runner: ubuntu-24.04
          - name: v2-frontend
            image_name: devbox-v2-frontend
            dockerfile: v2/frontend/Dockerfile
            context: v2/frontend
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: v2-server
            image_name: devbox-v2-server
            dockerfile: v2/server/Dockerfile
            context: v2/server
            build_contexts: |
              controller=v2/controller
            arch: amd64
            runner: ubuntu-24.04
          - name: v2-server
            image_name: devbox-v2-server
            dockerfile: v2/server/Dockerfile
            context: v2/server
            build_contexts: |
              controller=v2/controller
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: v2-httpgate
            image_name: devbox-v2-httpgate
            dockerfile: v2/httpgate/Dockerfile
            context: v2/httpgate
            arch: amd64
            runner: ubuntu-24.04
          - name: v2-httpgate
            image_name: devbox-v2-httpgate
            dockerfile: v2/httpgate/Dockerfile
            context: v2/httpgate
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: v2-sshgate
            image_name: devbox-v2-sshgate
            dockerfile: v2/sshgate/Dockerfile
            context: v2/sshgate
            arch: amd64
            runner: ubuntu-24.04
          - name: v2-sshgate
            image_name: devbox-v2-sshgate
            dockerfile: v2/sshgate/Dockerfile
            context: v2/sshgate
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          BUILD_CONTEXTS: ${{ matrix.build_contexts || '' }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/${{ matrix.image_name }}"
          TAGS=(
            "${IMAGE}:${GITHUB_REF_NAME}-${{ matrix.arch }}"
            "${IMAGE}:sha-${SHORT_SHA}-${{ matrix.arch }}"
            "${IMAGE}:latest-${{ matrix.arch }}"
          )

          BUILD_ARGS=(
            --platform "linux/${{ matrix.arch }}"
            --file "${{ matrix.dockerfile }}"
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}"
            --label "org.opencontainers.image.architecture=${{ matrix.arch }}"
            --label "runnumber=${GITHUB_RUN_ID}"
          )
          while IFS= read -r build_context; do
            if [ -n "${build_context}" ]; then
              BUILD_ARGS+=(--build-context "${build_context}")
            fi
          done <<< "${BUILD_CONTEXTS}"
          for tag in "${TAGS[@]}"; do
            BUILD_ARGS+=(--tag "${tag}")
          done

          docker build "${BUILD_ARGS[@]}" "${{ matrix.context }}"
          for tag in "${TAGS[@]}"; do
            docker push "${tag}"
          done

  v2-image-manifests:
    name: Release Manifest / v2 / ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    needs:
      - v2-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: devbox-v2-controller
          - image_name: devbox-v2-frontend
          - image_name: devbox-v2-server
          - image_name: devbox-v2-httpgate
          - image_name: devbox-v2-sshgate
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch image manifests
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/${{ matrix.image_name }}"

          docker manifest create "${IMAGE}:${GITHUB_REF_NAME}" \
            "${IMAGE}:${GITHUB_REF_NAME}-amd64" \
            "${IMAGE}:${GITHUB_REF_NAME}-arm64"
          docker manifest push "${IMAGE}:${GITHUB_REF_NAME}"

          docker manifest create "${IMAGE}:sha-${SHORT_SHA}" \
            "${IMAGE}:sha-${SHORT_SHA}-amd64" \
            "${IMAGE}:sha-${SHORT_SHA}-arm64"
          docker manifest push "${IMAGE}:sha-${SHORT_SHA}"

          docker manifest create "${IMAGE}:latest" \
            "${IMAGE}:latest-amd64" \
            "${IMAGE}:latest-arm64"
          docker manifest push "${IMAGE}:latest"

  v1-cluster-image:
    name: Release Image / v1-cluster / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs:
      - v1-image-manifests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install sealos
        run: sudo bash ./.github/scripts/install-sealos.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache images for sealos
        working-directory: v1/deploy
        run: |
          set -euo pipefail
          sudo sealos login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" ghcr.io
          ./scripts/sync-crds.sh
          for values_file in charts/devbox-v1/values.yaml charts/devbox-v1/devbox-v1-values.yaml; do
            sed -i "/^controller:/,/^frontend:/ s#^\([[:space:]]*repository:[[:space:]]*\).*#\1${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-controller#" "${values_file}"
            sed -i "/^controller:/,/^frontend:/ s#^\([[:space:]]*tag:[[:space:]]*\).*#\1${GITHUB_REF_NAME}#" "${values_file}"
            sed -i "/^frontend:/,/^ingress:/ s#^\([[:space:]]*repository:[[:space:]]*\).*#\1${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-frontend#" "${values_file}"
            sed -i "/^frontend:/,/^ingress:/ s#^\([[:space:]]*tag:[[:space:]]*\).*#\1${GITHUB_REF_NAME}#" "${values_file}"
          done
          sudo sealos registry save --registry-dir=registry_${{ matrix.arch }} --arch ${{ matrix.arch }} .

      - name: Build and push cluster image
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster"
          TAGS=(
            "${IMAGE}:${GITHUB_REF_NAME}-${{ matrix.arch }}"
            "${IMAGE}:latest-${{ matrix.arch }}"
          )

          BUILD_ARGS=(
            --platform "linux/${{ matrix.arch }}"
            --file v1/deploy/Kubefile
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}"
            --label "org.opencontainers.image.architecture=${{ matrix.arch }}"
            --label "runnumber=${GITHUB_RUN_ID}"
          )
          for tag in "${TAGS[@]}"; do
            BUILD_ARGS+=(--tag "${tag}")
          done

          docker build "${BUILD_ARGS[@]}" v1/deploy
          for tag in "${TAGS[@]}"; do
            docker push "${tag}"
          done

      - name: Save cluster image package
        run: |
          set -euo pipefail
          SOURCE_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:${GITHUB_REF_NAME}-${{ matrix.arch }}"
          PACKAGE_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:${GITHUB_REF_NAME}-${{ matrix.arch }}"
          docker pull "${SOURCE_IMAGE}"
          docker tag "${SOURCE_IMAGE}" "${PACKAGE_IMAGE}"
          mkdir -p release-assets
          docker save "${PACKAGE_IMAGE}" | gzip > "release-assets/devbox-v1-cluster-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz"

      - name: Install OSS tools
        run: |
          set -euo pipefail
          sudo -v
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: Upload cluster image package to OSS
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
        run: |
          set -euo pipefail
          : "${OSS_ENDPOINT:?OSS_ENDPOINT is required}"
          : "${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}"
          : "${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}"
          : "${OSS_BUCKET:?OSS_BUCKET is required}"
          TAR_NAME="release-assets/devbox-v1-cluster-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz"
          md5sum "${TAR_NAME}" > "${TAR_NAME}.md5"
          OSS_PREFIX="release/${GITHUB_REF_NAME}"
          OSS_TAR_NAME="devbox-v1-cluster-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar"
          ossutil64 cp -f -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" \
            "${TAR_NAME}" \
            "oss://${OSS_BUCKET}/${OSS_PREFIX}/${OSS_TAR_NAME}"
          ossutil64 cp -f -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" \
            "${TAR_NAME}.md5" \
            "oss://${OSS_BUCKET}/${OSS_PREFIX}/${OSS_TAR_NAME}.md5"

  v1-cluster-manifest:
    name: Release Image / v1-cluster manifest
    runs-on: ubuntu-latest
    needs:
      - v1-cluster-image
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          docker manifest create "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:${GITHUB_REF_NAME}" \
            "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:${GITHUB_REF_NAME}-amd64" \
            "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:${GITHUB_REF_NAME}-arm64"
          docker manifest push "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:${GITHUB_REF_NAME}"

          docker manifest create "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:latest" \
            "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:latest-amd64" \
            "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:latest-arm64"
          docker manifest push "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:latest"

  v2-frontend-cluster-image:
    name: Release Image / v2-frontend-cluster / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs:
      - v2-image-manifests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install sealos
        run: sudo bash ./.github/scripts/install-sealos.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache images for sealos
        working-directory: v2/frontend/deploy
        run: |
          set -euo pipefail
          sudo sealos login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" ghcr.io
          sed -i "s#^\([[:space:]]*repository:[[:space:]]*\)ghcr.io/.*/devbox-v2-frontend#\1${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v2-frontend#" charts/devbox-v2-frontend/values.yaml
          sed -i "s#^\([[:space:]]*tag:[[:space:]]*\).*#\1${GITHUB_REF_NAME}#" charts/devbox-v2-frontend/values.yaml
          make lint
          sudo sealos registry save --registry-dir=registry_${{ matrix.arch }} --arch ${{ matrix.arch }} .

      - name: Build and push cluster image
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v2-frontend-cluster"
          TAGS=(
            "${IMAGE}:${GITHUB_REF_NAME}-${{ matrix.arch }}"
            "${IMAGE}:latest-${{ matrix.arch }}"
          )

          BUILD_ARGS=(
            --platform "linux/${{ matrix.arch }}"
            --file v2/frontend/deploy/Kubefile
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}"
            --label "org.opencontainers.image.architecture=${{ matrix.arch }}"
            --label "runnumber=${GITHUB_RUN_ID}"
          )
          for tag in "${TAGS[@]}"; do
            BUILD_ARGS+=(--tag "${tag}")
          done

          docker build "${BUILD_ARGS[@]}" v2/frontend/deploy
          for tag in "${TAGS[@]}"; do
            docker push "${tag}"
          done

      - name: Save cluster image package
        run: |
          set -euo pipefail
          SOURCE_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v2-frontend-cluster:${GITHUB_REF_NAME}-${{ matrix.arch }}"
          PACKAGE_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v2-frontend-cluster:${GITHUB_REF_NAME}-${{ matrix.arch }}"
          docker pull "${SOURCE_IMAGE}"
          docker tag "${SOURCE_IMAGE}" "${PACKAGE_IMAGE}"
          mkdir -p release-assets
          docker save "${PACKAGE_IMAGE}" | gzip > "release-assets/devbox-v2-frontend-cluster-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz"

      - name: Install OSS tools
        run: |
          set -euo pipefail
          sudo -v
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: Upload cluster image package to OSS
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
        run: |
          set -euo pipefail
          : "${OSS_ENDPOINT:?OSS_ENDPOINT is required}"
          : "${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}"
          : "${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}"
          : "${OSS_BUCKET:?OSS_BUCKET is required}"
          TAR_NAME="release-assets/devbox-v2-frontend-cluster-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz"
          md5sum "${TAR_NAME}" > "${TAR_NAME}.md5"
          OSS_PREFIX="release/${GITHUB_REF_NAME}"
          OSS_TAR_NAME="devbox-v2-frontend-cluster-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar"
          ossutil64 cp -f -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" \
            "${TAR_NAME}" \
            "oss://${OSS_BUCKET}/${OSS_PREFIX}/${OSS_TAR_NAME}"
          ossutil64 cp -f -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" \
            "${TAR_NAME}.md5" \
            "oss://${OSS_BUCKET}/${OSS_PREFIX}/${OSS_TAR_NAME}.md5"

  v2-frontend-cluster-manifest:
    name: Release Image / v2-frontend-cluster manifest
    runs-on: ubuntu-latest
    needs:
      - v2-frontend-cluster-image
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          docker manifest create "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v2-frontend-cluster:${GITHUB_REF_NAME}" \
            "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v2-frontend-cluster:${GITHUB_REF_NAME}-amd64" \
            "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v2-frontend-cluster:${GITHUB_REF_NAME}-arm64"
          docker manifest push "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v2-frontend-cluster:${GITHUB_REF_NAME}"

          docker manifest create "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v2-frontend-cluster:latest" \
            "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v2-frontend-cluster:latest-amd64" \
            "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v2-frontend-cluster:latest-arm64"
          docker manifest push "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v2-frontend-cluster:latest"

  v1-cri-shim-patch-oss:
    name: OSS / v1-cri-shim-patch / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs:
      - v1-image-manifests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Save patch image package
        run: |
          set -euo pipefail
          SOURCE_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cri-shim-patch:${GITHUB_REF_NAME}"
          PACKAGE_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cri-shim-patch:${GITHUB_REF_NAME}-${{ matrix.arch }}"
          docker pull --platform "linux/${{ matrix.arch }}" "${SOURCE_IMAGE}"
          docker tag "${SOURCE_IMAGE}" "${PACKAGE_IMAGE}"
          mkdir -p release-assets
          docker save "${PACKAGE_IMAGE}" | gzip > "release-assets/devbox-v1-cri-shim-patch-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz"

      - name: Install OSS tools
        run: |
          set -euo pipefail
          sudo -v
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: Upload patch image package to OSS
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
        run: |
          set -euo pipefail
          : "${OSS_ENDPOINT:?OSS_ENDPOINT is required}"
          : "${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}"
          : "${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}"
          : "${OSS_BUCKET:?OSS_BUCKET is required}"
          TAR_NAME="release-assets/devbox-v1-cri-shim-patch-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz"
          md5sum "${TAR_NAME}" > "${TAR_NAME}.md5"
          OSS_PREFIX="release/${GITHUB_REF_NAME}"
          OSS_TAR_NAME="devbox-v1-cri-shim-patch-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar"
          ossutil64 cp -f -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" \
            "${TAR_NAME}" \
            "oss://${OSS_BUCKET}/${OSS_PREFIX}/${OSS_TAR_NAME}"
          ossutil64 cp -f -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" \
            "${TAR_NAME}.md5" \
            "oss://${OSS_BUCKET}/${OSS_PREFIX}/${OSS_TAR_NAME}.md5"

  controller-manifests:
    name: Controller Manifest / ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs:
      - v1-image-manifests
      - v2-image-manifests
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: v1
            workdir: v1/controller
            image: ghcr.io/${{ github.repository_owner }}/devbox-v1-controller:${{ github.ref_name }}
          - target: v2
            workdir: v2/controller
            image: ghcr.io/${{ github.repository_owner }}/devbox-v2-controller:${{ github.ref_name }}
    defaults:
      run:
        working-directory: ${{ matrix.workdir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.workdir }}/go.sum

      - name: Generate controller manifest
        run: make pre-deploy IMG=${{ matrix.image }}

      - name: Rename manifest artifact
        run: cp deploy/manifests/deploy.yaml dist-${{ matrix.target }}-controller-install.yaml

      - name: Upload manifest artifact
        uses: namespace-actions/upload-artifact@v1
        with:
          name: ${{ matrix.target }}-controller-install
          path: ${{ matrix.workdir }}/dist-${{ matrix.target }}-controller-install.yaml

  v1-cri-shim-binaries:
    name: Release Binary / v1-cri-shim
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1/cri-shim
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: v1/cri-shim/go.sum

      - name: Build cri-shim release binaries
        run: make build/release

      - name: Upload cri-shim artifact
        uses: namespace-actions/upload-artifact@v1
        with:
          name: v1-cri-shim-binaries
          path: v1/cri-shim/bin/*
          if-no-files-found: error

  v2-server-binaries:
    name: Release Binary / v2-server
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_arch: amd64
          - target_arch: arm64
    defaults:
      run:
        working-directory: v2/server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: v2/server/go.sum

      - name: Build server release binary
        run: make build TARGETARCH=${{ matrix.target_arch }}

      - name: Upload server artifact
        uses: namespace-actions/upload-artifact@v1
        with:
          name: v2-server-binaries-${{ matrix.target_arch }}
          path: v2/server/bin/devbox-api-${{ matrix.target_arch }}
          if-no-files-found: error

  v2-httpgate-chart:
    name: Release Artifact / v2-httpgate-chart
    runs-on: ubuntu-latest
    env:
      HTTPGATE_APP_VERSION: ${{ github.ref_name }}
      HTTPGATE_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/devbox-v2-httpgate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Package httpgate chart
        run: |
          workdir=$(mktemp -d)
          mkdir -p /tmp/httpgate-chart
          cp -R v2/httpgate/deploy/charts/httpgate "$workdir/httpgate"
          sed -i.bak "s#^appVersion: .*#appVersion: \"${HTTPGATE_APP_VERSION}\"#" "$workdir/httpgate/Chart.yaml"
          sed -i.bak "s#^  repository: .*#  repository: ${HTTPGATE_IMAGE_REPOSITORY}#" "$workdir/httpgate/values.yaml"
          rm "$workdir/httpgate/Chart.yaml.bak" "$workdir/httpgate/values.yaml.bak"
          tar -C "$workdir" -czf /tmp/httpgate-chart/devbox-v2-httpgate-chart-${{ github.ref_name }}.tgz httpgate

      - name: Upload httpgate chart artifact
        uses: namespace-actions/upload-artifact@v1
        with:
          name: v2-httpgate-chart
          path: /tmp/httpgate-chart/devbox-v2-httpgate-chart-${{ github.ref_name }}.tgz
          if-no-files-found: error

  v2-sshgate-chart:
    name: Release Artifact / v2-sshgate-chart
    runs-on: ubuntu-latest
    env:
      SSHGATE_APP_VERSION: ${{ github.ref_name }}
      SSHGATE_IMAGE: ghcr.io/${{ github.repository_owner }}/devbox-v2-sshgate:${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Package sshgate chart
        run: |
          workdir=$(mktemp -d)
          mkdir -p /tmp/sshgate-chart
          cp -R v2/sshgate/deploy/charts/sshgate "$workdir/sshgate"
          sed -i.bak "s#^appVersion: .*#appVersion: \"${SSHGATE_APP_VERSION}\"#" "$workdir/sshgate/Chart.yaml"
          sed -i.bak "s#^image: .*#image: ${SSHGATE_IMAGE}#" "$workdir/sshgate/values.yaml"
          rm "$workdir/sshgate/Chart.yaml.bak" "$workdir/sshgate/values.yaml.bak"
          tar -C "$workdir" -czf /tmp/sshgate-chart/devbox-v2-sshgate-chart-${{ github.ref_name }}.tgz sshgate

      - name: Upload sshgate chart artifact
        uses: namespace-actions/upload-artifact@v1
        with:
          name: v2-sshgate-chart
          path: /tmp/sshgate-chart/devbox-v2-sshgate-chart-${{ github.ref_name }}.tgz
          if-no-files-found: error

  v2-server-manifest:
    name: Release Artifact / v2-server-manifest
    runs-on: ubuntu-latest
    env:
      SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/devbox-v2-server:${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare server manifest artifact
        run: |
          cp v2/server/deploy/devbox-api.yaml v2/server/dist-v2-server-deploy.yaml
          sed -i.bak -E "s#ghcr.io/[^[:space:]\"]+/devbox-v2-server:[^[:space:]\"]+#${SERVER_IMAGE}#" v2/server/dist-v2-server-deploy.yaml
          rm v2/server/dist-v2-server-deploy.yaml.bak

      - name: Upload server manifest artifact
        uses: namespace-actions/upload-artifact@v1
        with:
          name: v2-server-manifest
          path: v2/server/dist-v2-server-deploy.yaml
          if-no-files-found: error

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - v1-image-manifests
      - v2-image-manifests
      - v1-cluster-manifest
      - v2-frontend-cluster-manifest
      - v1-cri-shim-patch-oss
      - controller-manifests
      - v1-cri-shim-binaries
      - v2-server-binaries
      - v2-httpgate-chart
      - v2-sshgate-chart
      - v2-server-manifest
    steps:
      - name: Download manifest artifacts
        uses: namespace-actions/download-artifact@v2
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/v1-controller-install/dist-v1-controller-install.yaml
            artifacts/v2-controller-install/dist-v2-controller-install.yaml
            artifacts/v1-cri-shim-binaries/*
            artifacts/v2-server-binaries-amd64/devbox-api-amd64
            artifacts/v2-server-binaries-arm64/devbox-api-arm64
            artifacts/v2-httpgate-chart/devbox-v2-httpgate-chart-${{ github.ref_name }}.tgz
            artifacts/v2-sshgate-chart/devbox-v2-sshgate-chart-${{ github.ref_name }}.tgz
            artifacts/v2-server-manifest/dist-v2-server-deploy.yaml
          body: |
            Container images published for `${{ github.ref_name }}`:

            - `ghcr.io/${{ github.repository_owner }}/devbox-v1-controller:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/devbox-v1-frontend:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/devbox-v1-cluster:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/devbox-v1-cri-shim-patch:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/devbox-v2-controller:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/devbox-v2-frontend:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/devbox-v2-frontend-cluster:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/devbox-v2-server:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/devbox-v2-httpgate:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/devbox-v2-sshgate:${{ github.ref_name }}`

            Binary artifacts attached to this release:

            - `v1-cri-shim` Linux binaries
            - `v2-server` Linux binaries (`amd64`, `arm64`)
            - `v2-httpgate` Helm chart package
            - `v2-sshgate` Helm chart package
            - `v2-server` deployment manifest

            Offline image packages uploaded to OSS:

            - `release/${{ github.ref_name }}/devbox-v1-cluster-${{ github.ref_name }}-amd64.tar`
            - `release/${{ github.ref_name }}/devbox-v1-cluster-${{ github.ref_name }}-arm64.tar`
            - `release/${{ github.ref_name }}/devbox-v2-frontend-cluster-${{ github.ref_name }}-amd64.tar`
            - `release/${{ github.ref_name }}/devbox-v2-frontend-cluster-${{ github.ref_name }}-arm64.tar`
            - `release/${{ github.ref_name }}/devbox-v1-cri-shim-patch-${{ github.ref_name }}-amd64.tar`
            - `release/${{ github.ref_name }}/devbox-v1-cri-shim-patch-${{ github.ref_name }}-arm64.tar`
