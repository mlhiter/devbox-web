name: Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  DOCKER_BUILDKIT: "1"
  DOCKER_CLI_EXPERIMENTAL: enabled

jobs:
  v1-images:
    name: Build / ${{ matrix.name }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v1-controller
            image_name: devbox-v1-controller
            dockerfile: v1/controller/Dockerfile
            context: v1/controller
            arch: amd64
            runner: namespace-profile-sealos-apps-amd64
          - name: v1-controller
            image_name: devbox-v1-controller
            dockerfile: v1/controller/Dockerfile
            context: v1/controller
            arch: arm64
            runner: namespace-profile-sealos-apps-arm64
          - name: v1-frontend
            image_name: devbox-v1-frontend
            dockerfile: v1/frontend/Dockerfile
            context: v1/frontend
            arch: amd64
            runner: namespace-profile-sealos-apps-amd64
          - name: v1-frontend
            image_name: devbox-v1-frontend
            dockerfile: v1/frontend/Dockerfile
            context: v1/frontend
            arch: arm64
            runner: namespace-profile-sealos-apps-arm64
          - name: v1-cri-shim-patch
            image_name: devbox-v1-cri-shim-patch
            dockerfile: v1/cri-shim/patch/Dockerfile
            context: v1/cri-shim
            arch: amd64
            runner: namespace-profile-sealos-apps-amd64
          - name: v1-cri-shim-patch
            image_name: devbox-v1-cri-shim-patch
            dockerfile: v1/cri-shim/patch/Dockerfile
            context: v1/cri-shim
            arch: arm64
            runner: namespace-profile-sealos-apps-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/${{ matrix.image_name }}"
          TAGS=(
            "${IMAGE}:${GITHUB_REF_NAME}-${{ matrix.arch }}"
            "${IMAGE}:sha-${SHORT_SHA}-${{ matrix.arch }}"
          )
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAGS+=("${IMAGE}:latest-${{ matrix.arch }}")
          fi

          BUILD_ARGS=(
            --platform "linux/${{ matrix.arch }}"
            --file "${{ matrix.dockerfile }}"
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}"
            --label "org.opencontainers.image.architecture=${{ matrix.arch }}"
            --label "runnumber=${GITHUB_RUN_ID}"
          )
          for tag in "${TAGS[@]}"; do
            BUILD_ARGS+=(--tag "${tag}")
          done

          docker build "${BUILD_ARGS[@]}" "${{ matrix.context }}"
          for tag in "${TAGS[@]}"; do
            docker push "${tag}"
          done

  v1-image-manifests:
    name: Publish / v1-image manifests / ${{ matrix.image_name }}
    runs-on: namespace-profile-sealos-apps-amd64
    needs:
      - v1-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: devbox-v1-controller
          - image_name: devbox-v1-frontend
          - image_name: devbox-v1-cri-shim-patch
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch image manifests
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/${{ matrix.image_name }}"

          docker manifest create "${IMAGE}:${GITHUB_REF_NAME}" \
            "${IMAGE}:${GITHUB_REF_NAME}-amd64" \
            "${IMAGE}:${GITHUB_REF_NAME}-arm64"
          docker manifest push "${IMAGE}:${GITHUB_REF_NAME}"

          docker manifest create "${IMAGE}:sha-${SHORT_SHA}" \
            "${IMAGE}:sha-${SHORT_SHA}-amd64" \
            "${IMAGE}:sha-${SHORT_SHA}-arm64"
          docker manifest push "${IMAGE}:sha-${SHORT_SHA}"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            docker manifest create "${IMAGE}:latest" \
              "${IMAGE}:latest-amd64" \
              "${IMAGE}:latest-arm64"
            docker manifest push "${IMAGE}:latest"
          fi

  v2-images:
    name: Build / ${{ matrix.name }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v2-controller
            image_name: devbox-v2-controller
            dockerfile: v2/controller/Dockerfile
            context: v2/controller
            arch: amd64
            runner: namespace-profile-sealos-apps-amd64
          - name: v2-controller
            image_name: devbox-v2-controller
            dockerfile: v2/controller/Dockerfile
            context: v2/controller
            arch: arm64
            runner: namespace-profile-sealos-apps-arm64
          - name: v2-frontend
            image_name: devbox-v2-frontend
            dockerfile: v2/frontend/Dockerfile
            context: v2/frontend
            arch: amd64
            runner: namespace-profile-sealos-apps-amd64
          - name: v2-frontend
            image_name: devbox-v2-frontend
            dockerfile: v2/frontend/Dockerfile
            context: v2/frontend
            arch: arm64
            runner: namespace-profile-sealos-apps-arm64
          - name: v2-server
            image_name: devbox-v2-server
            dockerfile: v2/server/Dockerfile
            context: v2/server
            build_contexts: |
              controller=v2/controller
            arch: amd64
            runner: namespace-profile-sealos-apps-amd64
          - name: v2-server
            image_name: devbox-v2-server
            dockerfile: v2/server/Dockerfile
            context: v2/server
            build_contexts: |
              controller=v2/controller
            arch: arm64
            runner: namespace-profile-sealos-apps-arm64
          - name: v2-httpgate
            image_name: devbox-v2-httpgate
            dockerfile: v2/httpgate/Dockerfile
            context: v2/httpgate
            arch: amd64
            runner: namespace-profile-sealos-apps-amd64
          - name: v2-httpgate
            image_name: devbox-v2-httpgate
            dockerfile: v2/httpgate/Dockerfile
            context: v2/httpgate
            arch: arm64
            runner: namespace-profile-sealos-apps-arm64
          - name: v2-sshgate
            image_name: devbox-v2-sshgate
            dockerfile: v2/sshgate/Dockerfile
            context: v2/sshgate
            arch: amd64
            runner: namespace-profile-sealos-apps-amd64
          - name: v2-sshgate
            image_name: devbox-v2-sshgate
            dockerfile: v2/sshgate/Dockerfile
            context: v2/sshgate
            arch: arm64
            runner: namespace-profile-sealos-apps-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          BUILD_CONTEXTS: ${{ matrix.build_contexts || '' }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/${{ matrix.image_name }}"
          TAGS=(
            "${IMAGE}:${GITHUB_REF_NAME}-${{ matrix.arch }}"
            "${IMAGE}:sha-${SHORT_SHA}-${{ matrix.arch }}"
          )
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAGS+=("${IMAGE}:latest-${{ matrix.arch }}")
          fi

          BUILD_ARGS=(
            --platform "linux/${{ matrix.arch }}"
            --file "${{ matrix.dockerfile }}"
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}"
            --label "org.opencontainers.image.architecture=${{ matrix.arch }}"
            --label "runnumber=${GITHUB_RUN_ID}"
          )
          while IFS= read -r build_context; do
            if [ -n "${build_context}" ]; then
              BUILD_ARGS+=(--build-context "${build_context}")
            fi
          done <<< "${BUILD_CONTEXTS}"
          for tag in "${TAGS[@]}"; do
            BUILD_ARGS+=(--tag "${tag}")
          done

          docker build "${BUILD_ARGS[@]}" "${{ matrix.context }}"
          for tag in "${TAGS[@]}"; do
            docker push "${tag}"
          done

  v2-image-manifests:
    name: Publish / v2-image manifests / ${{ matrix.image_name }}
    runs-on: namespace-profile-sealos-apps-amd64
    needs:
      - v2-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: devbox-v2-controller
          - image_name: devbox-v2-frontend
          - image_name: devbox-v2-server
          - image_name: devbox-v2-httpgate
          - image_name: devbox-v2-sshgate
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch image manifests
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/${{ matrix.image_name }}"

          docker manifest create "${IMAGE}:${GITHUB_REF_NAME}" \
            "${IMAGE}:${GITHUB_REF_NAME}-amd64" \
            "${IMAGE}:${GITHUB_REF_NAME}-arm64"
          docker manifest push "${IMAGE}:${GITHUB_REF_NAME}"

          docker manifest create "${IMAGE}:sha-${SHORT_SHA}" \
            "${IMAGE}:sha-${SHORT_SHA}-amd64" \
            "${IMAGE}:sha-${SHORT_SHA}-arm64"
          docker manifest push "${IMAGE}:sha-${SHORT_SHA}"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            docker manifest create "${IMAGE}:latest" \
              "${IMAGE}:latest-amd64" \
              "${IMAGE}:latest-arm64"
            docker manifest push "${IMAGE}:latest"
          fi

  v1-cluster-image:
    name: Build / v1-cluster-image / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs:
      - v1-image-manifests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: namespace-profile-sealos-apps-amd64
          - arch: arm64
            runner: namespace-profile-sealos-apps-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install sealos
        run: sudo bash ./.github/scripts/install-sealos.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache images for sealos
        working-directory: v1/deploy
        run: |
          set -euo pipefail
          sudo sealos login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" ghcr.io
          ./scripts/sync-crds.sh
          for values_file in charts/devbox-v1/values.yaml charts/devbox-v1/devbox-v1-values.yaml; do
            sed -i "/^controller:/,/^frontend:/ s#^\([[:space:]]*repository:[[:space:]]*\).*#\1${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-controller#" "${values_file}"
            sed -i "/^controller:/,/^frontend:/ s#^\([[:space:]]*tag:[[:space:]]*\).*#\1${GITHUB_REF_NAME}#" "${values_file}"
            sed -i "/^frontend:/,/^ingress:/ s#^\([[:space:]]*repository:[[:space:]]*\).*#\1${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-frontend#" "${values_file}"
            sed -i "/^frontend:/,/^ingress:/ s#^\([[:space:]]*tag:[[:space:]]*\).*#\1${GITHUB_REF_NAME}#" "${values_file}"
          done
          sudo sealos registry save --registry-dir=registry_${{ matrix.arch }} --arch ${{ matrix.arch }} .

      - name: Build and push cluster image
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster"
          TAGS=(
            "${IMAGE}:${GITHUB_REF_NAME}-${{ matrix.arch }}"
            "${IMAGE}:sha-${SHORT_SHA}-${{ matrix.arch }}"
          )
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAGS+=("${IMAGE}:latest-${{ matrix.arch }}")
          fi

          BUILD_ARGS=(
            --platform "linux/${{ matrix.arch }}"
            --file v1/deploy/Kubefile
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}"
            --label "org.opencontainers.image.architecture=${{ matrix.arch }}"
            --label "runnumber=${GITHUB_RUN_ID}"
          )
          for tag in "${TAGS[@]}"; do
            BUILD_ARGS+=(--tag "${tag}")
          done

          docker build "${BUILD_ARGS[@]}" v1/deploy
          for tag in "${TAGS[@]}"; do
            docker push "${tag}"
          done

      - name: Save cluster image package
        if: github.ref_name == 'main'
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          SOURCE_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:sha-${SHORT_SHA}-${{ matrix.arch }}"
          PACKAGE_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:main-${SHORT_SHA}-${{ matrix.arch }}"
          docker pull "${SOURCE_IMAGE}"
          docker tag "${SOURCE_IMAGE}" "${PACKAGE_IMAGE}"
          mkdir -p release-assets
          docker save "${PACKAGE_IMAGE}" | gzip > "release-assets/devbox-v1-cluster-main-${SHORT_SHA}-${{ matrix.arch }}.tar.gz"

      - name: Install OSS tools
        if: github.ref_name == 'main'
        run: |
          set -euo pipefail
          sudo -v
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: Upload cluster image package to OSS
        if: github.ref_name == 'main'
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
        run: |
          set -euo pipefail
          : "${OSS_ENDPOINT:?OSS_ENDPOINT is required}"
          : "${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}"
          : "${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}"
          : "${OSS_BUCKET:?OSS_BUCKET is required}"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          TAR_NAME="release-assets/devbox-v1-cluster-main-${SHORT_SHA}-${{ matrix.arch }}.tar.gz"
          md5sum "${TAR_NAME}" > "${TAR_NAME}.md5"
          OSS_PREFIX="ci/main/${SHORT_SHA}"
          OSS_TAR_NAME="devbox-v1-cluster-main-${SHORT_SHA}-${{ matrix.arch }}.tar"
          ossutil64 cp -f -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" \
            "${TAR_NAME}" \
            "oss://${OSS_BUCKET}/${OSS_PREFIX}/${OSS_TAR_NAME}"
          ossutil64 cp -f -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" \
            "${TAR_NAME}.md5" \
            "oss://${OSS_BUCKET}/${OSS_PREFIX}/${OSS_TAR_NAME}.md5"

  v1-cluster-manifest:
    name: Publish / v1-cluster-image manifest
    runs-on: namespace-profile-sealos-apps-amd64
    needs:
      - v1-cluster-image
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          docker manifest create "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:${GITHUB_REF_NAME}" \
            "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:${GITHUB_REF_NAME}-amd64" \
            "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:${GITHUB_REF_NAME}-arm64"
          docker manifest push "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:${GITHUB_REF_NAME}"

          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          docker manifest create "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:sha-${SHORT_SHA}" \
            "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:sha-${SHORT_SHA}-amd64" \
            "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:sha-${SHORT_SHA}-arm64"
          docker manifest push "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:sha-${SHORT_SHA}"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            docker manifest create "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:latest" \
              "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:latest-amd64" \
              "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:latest-arm64"
            docker manifest push "${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cluster:latest"
          fi

  v1-cri-shim-patch-oss:
    name: OSS / v1-cri-shim-patch / ${{ matrix.arch }}
    if: github.ref_name == 'main'
    runs-on: ${{ matrix.runner }}
    needs:
      - v1-image-manifests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: namespace-profile-sealos-apps-amd64
          - arch: arm64
            runner: namespace-profile-sealos-apps-arm64
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Save patch image package
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          SOURCE_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cri-shim-patch:sha-${SHORT_SHA}"
          PACKAGE_IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/devbox-v1-cri-shim-patch:main-${SHORT_SHA}-${{ matrix.arch }}"
          docker pull --platform "linux/${{ matrix.arch }}" "${SOURCE_IMAGE}"
          docker tag "${SOURCE_IMAGE}" "${PACKAGE_IMAGE}"
          mkdir -p release-assets
          docker save "${PACKAGE_IMAGE}" | gzip > "release-assets/devbox-v1-cri-shim-patch-main-${SHORT_SHA}-${{ matrix.arch }}.tar.gz"

      - name: Install OSS tools
        run: |
          set -euo pipefail
          sudo -v
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: Upload patch image package to OSS
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
        run: |
          set -euo pipefail
          : "${OSS_ENDPOINT:?OSS_ENDPOINT is required}"
          : "${OSS_ACCESS_KEY_ID:?OSS_ACCESS_KEY_ID is required}"
          : "${OSS_ACCESS_KEY_SECRET:?OSS_ACCESS_KEY_SECRET is required}"
          : "${OSS_BUCKET:?OSS_BUCKET is required}"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          TAR_NAME="release-assets/devbox-v1-cri-shim-patch-main-${SHORT_SHA}-${{ matrix.arch }}.tar.gz"
          md5sum "${TAR_NAME}" > "${TAR_NAME}.md5"
          OSS_PREFIX="ci/main/${SHORT_SHA}"
          OSS_TAR_NAME="devbox-v1-cri-shim-patch-main-${SHORT_SHA}-${{ matrix.arch }}.tar"
          ossutil64 cp -f -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" \
            "${TAR_NAME}" \
            "oss://${OSS_BUCKET}/${OSS_PREFIX}/${OSS_TAR_NAME}"
          ossutil64 cp -f -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" \
            "${TAR_NAME}.md5" \
            "oss://${OSS_BUCKET}/${OSS_PREFIX}/${OSS_TAR_NAME}.md5"
