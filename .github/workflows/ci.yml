name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.25.3"
  NODE_VERSION: "20"
  PNPM_VERSION: "10.32.1"
  RUST_TOOLCHAIN: "stable"

jobs:
  controller:
    name: Controller / ${{ matrix.target }}
    runs-on: namespace-profile-sealos-apps-amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: v1
            workdir: v1/controller
          - target: v2
            workdir: v2/controller
    defaults:
      run:
        working-directory: ${{ matrix.workdir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.workdir }}/go.sum

      - name: Run controller tests
        run: make test

  server:
    name: Server / v2
    runs-on: namespace-profile-sealos-apps-amd64
    defaults:
      run:
        working-directory: v2/server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: v2/server/go.sum

      - name: Test server
        run: make test

      - name: Build server
        run: make build

  httpgate:
    name: HTTP Gate / v2
    runs-on: namespace-profile-sealos-apps-amd64
    defaults:
      run:
        working-directory: v2/httpgate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install httpgate build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev

      - name: Test httpgate
        run: cargo test --locked

      - name: Build httpgate
        run: cargo build --locked --release

  sshgate:
    name: SSH Gate / v2
    runs-on: namespace-profile-sealos-apps-amd64
    defaults:
      run:
        working-directory: v2/sshgate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: v2/sshgate/go.sum

      - name: Test sshgate
        run: |
          unset LOG_FORMAT LOG_LEVEL SSH_LISTEN_ADDR SSH_HOST_KEY_SEED SSH_BACKEND_PORT ENABLE_AGENT_FORWARD ENABLE_PROXY_JUMP
          go test ./...

      - name: Build sshgate
        run: make build

  cri-shim:
    name: CRI Shim / v1
    runs-on: namespace-profile-sealos-apps-amd64
    defaults:
      run:
        working-directory: v1/cri-shim
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: v1/cri-shim/go.sum

      - name: Test cri-shim
        run: make test

      - name: Build cri-shim
        run: make build

  frontend:
    name: Frontend / ${{ matrix.target }}
    runs-on: namespace-profile-sealos-apps-amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: v1
            workdir: v1/frontend
          - target: v2
            workdir: v2/frontend
    defaults:
      run:
        working-directory: ${{ matrix.workdir }}
    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/devbox?schema=public"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.workdir }}/pnpm-lock.yaml

      - name: Verify frontend
        run: make verify

  vscode-extension:
    name: VS Code Extension
    runs-on: namespace-profile-sealos-apps-amd64
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint extension
        run: npm run lint

      - name: Build extension
        run: npm run package
